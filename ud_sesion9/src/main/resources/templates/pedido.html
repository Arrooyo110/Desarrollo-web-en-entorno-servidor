<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bicicletas Nervión - Mostrador</title>
</head>
<body>
<h1>Mostrador de Bicicletas Nervión</h1>

<!-- Formulario con method="get" apuntando a la ruta del controlador -->
<form action="/pedido" method="get">
    <div>
        <label for="producto">Producto:</label>
        <input type="text" id="producto" name="producto">
    </div>
    <div>
        <label for="precio">Precio:</label>
        <input type="number" step="0.01" id="precio" name="precio">
    </div>
    <div>
        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" name="cantidad">
    </div>
    <button type="submit">Calcular Desglose</button>
</form>

<hr>

<h2>Desglose del cálculo</h2>
<ul>
    <li><strong>Producto:</strong> <span th:text="${producto}">Texto de relleno del producto</span></li>
    <li><strong>Cantidad:</strong> <span th:text="${cantidad}">0</span></li>
    <li><strong>Precio unitario:</strong> <span th:text="${precio}">0.00</span> €</li>
    <li><strong>Base imponible:</strong> <span th:text="${base}">0.00</span> €</li>
    <li><strong>IVA (21%):</strong> <span th:text="${iva}">0.00</span> €</li>
    <li><strong>Total a pagar:</strong> <span th:text="${total}">0.00</span> €</li>
</ul>
</body>
</html>
