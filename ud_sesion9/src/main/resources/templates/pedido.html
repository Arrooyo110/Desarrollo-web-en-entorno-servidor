<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Bicicletas Nervión - Mostrador</title>
    <style>
        .error-box { border: 2px solid red; background-color: #ffe6e6; padding: 15px; margin-bottom: 20px; color: red; }
        .form-group { margin-bottom: 15px; }
    </style>
</head>
<body>
<h1>Mostrador de Bicicletas Nervión</h1>

<div th:if="${errores != null and !errores.isEmpty()}" class="error-box">
    <strong>Se han encontrado los siguientes errores en tu pedido:</strong>
    <ul>
        <li th:each="error : ${errores}" th:text="${error}"></li>
    </ul>
</div>
<form action="#" th:action="@{/pedido}" th:object="${pedidoForm}" method="post">

    <div class="form-group">
        <label>Unidades (1-100):</label>
        <input type="number" th:field="*{unidades}">
    </div>

    <div class="form-group">
        <label>Precio (€):</label>
        <input type="number" step="0.01" th:field="*{precio}">
    </div>

    <div class="form-group">
        <label>Tipo de cliente:</label>
        <select th:field="*{cliente}">
            <option value="particular">Particular</option>
            <option value="club">Club</option>
        </select>
    </div>

    <div class="form-group">
        <label>Incluir montaje (+15€):</label>
        <input type="checkbox" th:field="*{montaje}" value="true">
    </div>

    <button type="submit">Calcular Desglose</button>
</form>
</body>
</html>
